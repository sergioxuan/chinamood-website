<head>

<meta charset="UTF-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Sue+Ellen+Francisco&display=swap" rel="stylesheet">


<style>
  
*{
  box-sizing: border-box;
}


.product-page

{
display: flex;
gap:30px;
padding: 40px;
max-width: 900px;
margin:0 auto;
align-items:flex-start;

}

.product-imgs
{
width: 420px;
}

.product-img
{
width:100%;
height:auto;
display:block;
margin-bottom: 16px;
}

.product-info
{
max-width: 300px;
padding: 24px;
position: sticky;
top: 40px; 
}


p{
margin-bottom:20px;
}

button
{
width:100%;
height:40px;
margin-bottom:16px;
display:block;
box-sizing: border-box;
}

.back,.color,.price
{
font-size:11px;
}
.description,.model
{
font-family:'lora', serif;
font-size:11px;
}

.description
{
line-height: 1.5;
}

.select
{
font-size: 12px;
font-weight: bold;
}

</style>

</head>





<body>

<div class="product-page">

    <div class="product-imgs">

     <img class="product-img" src="images/suzhou-01.PNG">
     <img class="product-img" src="images/suzhou-02.PNG">
     <img class="product-img" src="images/suzhou-03.PNG">
     <img class="product-img" src="images/suzhou-04.PNG">
     <img class="product-img" src="images/suzhou-05.PNG">
    </div>

  <div class="product-info">
<p class="back">back</p>
<p class="color">White</p>
<p class="price">70</P>
<P class="description">Echoing our J90, the J2000 T-shirt’s design is inspired by 
  80/90’s tour merch, enhanced with a baggier, boxier fit while maintaining the 
  signature single stitch and thick collar.
</P>
<p class="model">Model is 6’2” wearing size Large</p>
<p class="select">Select</p>
<button class="size-button"> 
  size
</button>

<button class="addtocart-button">
  Add to cart
</button>

   </div>

</div>

</body>
